<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة لَوْ.. | مواقف افتراضية</title>
    <!-- استدعاء ملف التنسيق بعد تعديل اسمه وحذف المسافة -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- شاشة الإعداد -->
        <div id="setup-screen" class="screen active">
            <h1 class="game-title">🤔 لعبة لَوْ..</h1>
            <p class="game-subtitle">مواقف افتراضية محرجة تكشف المستور وتتحكم في الخصوصية!</p>
            
            <div class="mode-selection">
                <h3>اختر الفئة:</h3>
                <div class="modes-grid">
                    <button class="mode-btn active" data-mode="all">🔥 الكل</button>
                    <button class="mode-btn" data-mode="tech">📱 تكنولوجيا</button>
                    <button class="mode-btn" data-mode="social">🤐 اجتماعي</button>
                    <button class="mode-btn" data-mode="scandal">🤦‍♂️ فضائح</button>
                </div>
            </div>

            <div class="players-section">
                <h3><i class="fa-solid fa-users"></i> اللاعبين:</h3>
                <div id="players-list">
                    <div class="player-input-group">
                        <input type="text" class="player-input" placeholder="اسم اللاعب الأول...">
                    </div>
                    <div class="player-input-group">
                        <input type="text" class="player-input" placeholder="اسم اللاعب الثاني...">
                    </div>
                </div>
                <button id="add-player-btn" class="secondary-btn"><i class="fa-solid fa-plus"></i> إضافة لاعب جديد</button>
            </div>

            <button id="start-game-btn" class="primary-btn">ابدأ التحدي <i class="fa-solid fa-play"></i></button>
        </div>

        <!-- شاشة اللعب والـ 50 كارت -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <button id="back-btn" class="icon-btn"><i class="fa-solid fa-arrow-right"></i></button>
                <div class="score-display">الموقف الحالي</div>
                <button id="theme-toggle" class="icon-btn"><i class="fa-solid fa-moon"></i></button>
            </div>

            <div class="turn-announcement">
                دور اللاعب: <span id="current-player-name">أحمد</span>
            </div>

            <!-- الكارت الأنيق -->
            <div class="card-wrapper">
                <div id="question-card" class="elegant-card">
                    <div class="card-glow"></div>
                    <div class="card-content">
                        <div class="card-tag" id="card-category">لو.. 🤔</div>
                        <p class="question-text" id="question-text">اضغط على التالي لسحب الموقف الأول!</p>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="skip-btn" class="danger-btn"><i class="fa-solid fa-circle-xmark"></i> انسحاب</button>
                <button id="next-btn" class="success-btn">الموقف التالي <i class="fa-solid fa-circle-chevron-left"></i></button>
            </div>
        </div>
    </div>

    <!-- استدعاء ملفات الجافاسكريبت بالأسماء الصحيحة الجديدة بدون مسافات -->
    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
